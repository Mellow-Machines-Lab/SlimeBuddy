# The checks anyone can run without a board, a key or Bluetooth, as the
# engine's CI runs them, with this character: its pack checked, the Swift
# tests, the firmware's tests (this pack's own first, then the engine's with
# Pixel's) and this board's firmware. engine/ is the engine at the commit
# this repository pins.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pack:
    name: Pack checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: recursive
      - name: The pack checks out (its moods, its rig, its studio entry, with the other character's beside it)
        run: make setup && /usr/bin/python3 engine/internal/tools/packs.py && /usr/bin/python3 engine/characters/charactergen.py --check character
      - name: The slime's generated files are fresh
        run: node character/tools/slimegen/slimegen.mjs --check
      - name: The pack's tool tests
        run: |
          [ -d character/tests/tools ] || exit 0
          /usr/bin/python3 -m unittest discover -s character/tests/tools

  swift:
    name: Swift tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: recursive
      - run: swift --version
      - name: Build, then Boop's tests and each package's, with both characters
        run: |
          set -o pipefail
          make setup
          cd engine && python3 internal/tools/packs.py && make -C internal test 2>&1 | tee ../test.log
      - name: Show the errors
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "error:|✘|FAIL|failed" | sort -u | head -20 |
            while IFS= read -r line; do echo "::error title=Swift tests::$line"; done

  firmware:
    name: Firmware
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: engine/firmware/.platformio-core
          key: pio-${{ runner.os }}-${{ hashFiles('engine/firmware/platformio.ini', 'engine/linkkit/device/platformio.ini') }}
      - name: The firmware for Waveshare ESP32-S3-Touch-AMOLED-2.06
        run: make setup && cd engine && firmware/tools/pio.sh run -e amoled206
      - name: The firmware's tests, this pack's own, then the engine's with Pixel's
        run: |
          make setup
          cd engine && python3 internal/tools/packs.py && make -C internal fw-test
      - name: The Mac's mirror of the board, its page and every gel scenario's shots against the simulator
        run: |
          node --test character/tests/mirror/page.test.mjs
          cd engine && CHARACTER=boop internal/tools/boopctl mirror
